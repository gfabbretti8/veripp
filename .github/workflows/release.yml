name: release

# Tagging v* publishes to PyPI -- after re-proving, in this same run, that the
# thing being published works. A green ci run on the same commit is not enough
# of a gate: workflows race, and a tag pushed seconds after a bad commit would
# publish before ci finished failing.
#
# Three wheels and an sdist go up together: the pure py3-none-any wheel, and
# a manylinux wheel for x86_64 and for arm64 that carries ESBMC's static
# release binary at veripp/bin/esbmc. pip takes the platform wheel where one
# matches, so `pip install veripp` is the whole installation on Linux, and the
# pure wheel everywhere else. Each platform wheel is pip-installed in a clean
# container and put through `veripp doctor` before anything is uploaded.
#
# A workflow_dispatch runs everything but the upload: the way to rehearse a
# release without a tag.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  # Kept in lockstep with ci.yml -- see the comment there for why this
  # release and not 8.4 (esbmc#6508, silently missed OOB writes).
  ESBMC_VERSION: v8.6

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Cache ESBMC
        id: cache-esbmc
        uses: actions/cache@v4
        with:
          path: ~/.local/esbmc
          key: esbmc-${{ env.ESBMC_VERSION }}-linux-${{ hashFiles('.github/workflows/ci.yml', 'checker/esbmc-linux.zip.sha256') }}

      - name: Install zsh, for the completion tests
        run: sudo apt-get update -qq && sudo apt-get install -y -qq zsh

      - name: Install ESBMC
        if: steps.cache-esbmc.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.local/esbmc
          curl -fsSL -o /tmp/esbmc.zip \
            "https://github.com/esbmc/esbmc/releases/download/${ESBMC_VERSION}/esbmc-linux.zip"
          # The build ci.yml pins, and no other: see the comment there.
          echo "$(cat checker/esbmc-linux.zip.sha256)  /tmp/esbmc.zip" | sha256sum -c -
          unzip -q /tmp/esbmc.zip -d ~/.local/esbmc
          chmod +x "$(find ~/.local/esbmc -name esbmc -type f | head -1)"

      - name: Put ESBMC on PATH
        run: dirname "$(find ~/.local/esbmc -name esbmc -type f | head -1)" >> "$GITHUB_PATH"

      - run: uv sync --locked

      # The soundness gate. A release built against a checker that silently
      # misses a bug class would ship proofs that are not proofs.
      - run: uv run veripp doctor

      - run: uv run pytest -q -rs

  # One platform wheel per architecture, on a native runner: `strip` has to
  # understand the binary, and the install test runs it.
  wheels:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1

      - name: Build the pure wheel
        run: uv build --wheel --out-dir pure

      - name: Fetch the pinned release binary, check its digest, strip it
        run: ./checker/build_linux_payload.sh ${{ matrix.arch }} payload

      # The binary is static, so it needs nothing from the host; manylinux_2_17
      # is the oldest tag pip accepts everywhere, and the honest one.
      - name: Bundle it into the wheel
        run: python3 checker/bundle_wheel.py --wheel pure/veripp-*-py3-none-any.whl
             --payload payload --plat manylinux_2_17_${{ matrix.arch }} --outdir dist

      - name: Install the wheel in a clean container and probe its checker
        run: |
          mkdir -p itest && cp dist/*.whl itest/ && cp -r examples itest/examples
          cat > itest/Dockerfile <<'DOCKER'
          FROM python:3.12-slim
          COPY *.whl /tmp/
          COPY examples /tmp/examples
          RUN pip install -q /tmp/*.whl
          DOCKER
          docker build -q -t veripp-wheel-itest itest
          docker run --rm veripp-wheel-itest sh -c '
            found="$(python -c "from veripp.checker import bundled_esbmc; print(bundled_esbmc() or \"\")")"
            test -n "$found" || { echo "::error::the wheel carries no runnable checker"; exit 1; }
            echo "bundled checker: $found"
            veripp doctor || exit 1
            veripp verify /tmp/examples/off_by_one.cpp --function sum_array --no-llm; status=$?
            test "$status" -eq 1 || { echo "::error::expected exit 1 (counterexample) from the example, got $status"; exit 1; }'

      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.arch }}
          path: dist/*.whl
          if-no-files-found: error

  publish:
    needs: [test, wheels]
    # Publishing is the one irreversible step, so it gets its own job: a
    # failure above stops before anything leaves the machine -- and a
    # workflow_dispatch stops here, having built and tested everything.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1

      - name: Tag must match pyproject version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version=$(grep -m1 '^version' pyproject.toml | sed 's/.*"\(.*\)".*/\1/')
          if [ "$tag" != "$version" ]; then
            echo "::error::tag v$tag but pyproject.toml says $version -- refusing to publish a mislabelled build"
            exit 1
          fi

      - run: uv build

      - uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true

      # A platform wheel without the pure one, or the pure one without both
      # platform wheels, leaves some users worse off than publishing nothing:
      # pip would either fail to resolve or silently hand them no checker.
      - name: Refuse to publish an incomplete set
        run: |
          ls -la dist
          test -n "$(ls dist/*-py3-none-any.whl 2>/dev/null)" \
            || { echo "::error::missing the pure py3-none-any wheel"; exit 1; }
          test -n "$(ls dist/*.tar.gz 2>/dev/null)" \
            || { echo "::error::missing the sdist"; exit 1; }
          for arch in x86_64 aarch64; do
            test -n "$(ls dist/*manylinux*_${arch}.whl 2>/dev/null)" \
              || { echo "::error::missing the ${arch} wheel"; exit 1; }
          done

      # Catches the failure that is otherwise invisible until the project
      # page is live: a README that does not render on PyPI.
      - name: twine check
        run: uv run --with twine twine check dist/*

      # The README tells people to run examples/*.cpp, so they must ship.
      - name: sdist carries the examples
        run: tar tzf dist/*.tar.gz | grep -q examples/

      # A re-pushed tag (or a re-run of this workflow) must not die on
      # PyPI's "file already exists" -- skip-existing makes the re-run a
      # no-op instead of a red X that looks like a broken release.
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_TOKEN }}
          skip-existing: true

      # Confirm the thing users will actually do works, against the real
      # index. Retries because the index can lag the upload by a minute.
      - name: uvx veripp from PyPI
        run: |
          version="${GITHUB_REF_NAME#v}"
          for i in $(seq 1 10); do
            if uvx --refresh "veripp==${version}" --version; then exit 0; fi
            echo "not on the index yet, retry $i"; sleep 30
          done
          echo "::error::veripp ${version} never became installable from PyPI"
          exit 1
