name: ci
on: [push, pull_request]

env:
  # `weekly` is a rolling tag rebuilt from master. We track it rather than the
  # v8.4 release because 8.4 carries esbmc#6508 -- it silently misses
  # out-of-bounds writes to a member array indexed by another member of the
  # same object, which is the ordinary container idiom and exactly the code
  # veripp is pointed at. `veripp doctor` below re-checks that behaviourally on
  # every run, so a regression in the rolling build fails the job rather than
  # quietly weakening every "verified".
  ESBMC_VERSION: weekly

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1  # no floating v10 tag is published
        with:
          enable-cache: true

      - name: Cache ESBMC
        id: cache-esbmc
        uses: actions/cache@v4
        with:
          path: ~/.local/esbmc
          # The weekly tag is rolling, so the cache key carries the week.
          key: esbmc-${{ env.ESBMC_VERSION }}-linux-${{ hashFiles('.github/workflows/ci.yml') }}

      - name: Install ESBMC
        if: steps.cache-esbmc.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.local/esbmc
          curl -fsSL -o /tmp/esbmc.zip \
            "https://github.com/esbmc/esbmc/releases/download/${ESBMC_VERSION}/esbmc-linux.zip"
          unzip -q /tmp/esbmc.zip -d ~/.local/esbmc
          chmod +x "$(find ~/.local/esbmc -name esbmc -type f | head -1)"

      - name: Put ESBMC on PATH
        run: dirname "$(find ~/.local/esbmc -name esbmc -type f | head -1)" >> "$GITHUB_PATH"

      - run: esbmc --version

      # --locked fails if uv.lock is out of date with pyproject.toml, so a
      # dependency change cannot land without its lockfile update.
      - run: uv sync --locked
      # No --allow-unsound: the tracked build must pass the soundness probes.
      - run: uv run veripp doctor
      - run: uv run pytest -q

  # The tests run from a source checkout; this proves the published artifact
  # works too. The contracts header must ship inside the wheel or every
  # verification fails with "'veripp/contracts.hpp' file not found".
  wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.0.1  # no floating v10 tag is published
        with:
          enable-cache: true
      - run: uv build
      - name: The header must be in the wheel
        run: unzip -l dist/*.whl | grep -q 'veripp/include/veripp/contracts.hpp'
      - name: Install the wheel on its own and check it can find its header
        run: |
          uv tool install ./dist/*.whl
          cd "$(mktemp -d)"   # nowhere near the source tree
          veripp doctor | tee doctor.txt
          grep -q 'contracts header: /' doctor.txt
