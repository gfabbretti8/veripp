name: ci
on: [push, pull_request]

env:
  # We track `weekly` rather than the v8.4 release because 8.4 carries
  # esbmc#6508 -- it silently misses out-of-bounds writes to a member array
  # indexed by another member of the same object, which is the ordinary
  # container idiom and exactly the code veripp is pointed at.
  #
  # `weekly` is newer than 8.4 and passes our soundness probe, but do not read
  # it as "master": despite the name it is cut infrequently. As of 2026-08-24
  # it points at a commit from 2026-05-27, with master ~1900 commits ahead.
  # That is why `veripp doctor` re-checks the checker behaviourally on every
  # run instead of trusting a version string.
  ESBMC_VERSION: weekly

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1  # no floating v10 tag is published
        with:
          enable-cache: true

      - name: Cache ESBMC
        id: cache-esbmc
        uses: actions/cache@v4
        with:
          path: ~/.local/esbmc
          # Keyed on this file's hash, not a date: bumping ESBMC_VERSION or
          # editing this workflow rotates the cache. A silently re-cut `weekly`
          # under the same name would keep the old binary -- acceptable because
          # `veripp doctor` re-probes the checker's soundness on every run, so
          # a regressed build fails the run rather than passing on a stale hit.
          key: esbmc-${{ env.ESBMC_VERSION }}-linux-${{ hashFiles('.github/workflows/ci.yml') }}

      # zsh is not on the runner image, and without it the zsh completion is
      # generated but never checked for validity -- a broken one would ship.
      - name: Install zsh, for the completion tests
        run: sudo apt-get update -qq && sudo apt-get install -y -qq zsh

      - name: Install ESBMC
        if: steps.cache-esbmc.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.local/esbmc
          curl -fsSL -o /tmp/esbmc.zip \
            "https://github.com/esbmc/esbmc/releases/download/${ESBMC_VERSION}/esbmc-linux.zip"
          unzip -q /tmp/esbmc.zip -d ~/.local/esbmc
          chmod +x "$(find ~/.local/esbmc -name esbmc -type f | head -1)"

      - name: Put ESBMC on PATH
        run: dirname "$(find ~/.local/esbmc -name esbmc -type f | head -1)" >> "$GITHUB_PATH"

      - run: esbmc --version

      # --locked fails if uv.lock is out of date with pyproject.toml, so a
      # dependency change cannot land without its lockfile update.
      - run: uv sync --locked
      # No --allow-unsound: the tracked build must pass the soundness probes.
      - run: uv run veripp doctor
      - run: uv run pytest -q -rs

  # The tests run from a source checkout; this proves the published artifact
  # works too. The contracts header must ship inside the wheel or every
  # verification fails with "'veripp/contracts.hpp' file not found".
  wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.0.1  # no floating v10 tag is published
        with:
          enable-cache: true
      - run: uv build
      - name: The header must be in the wheel
        run: unzip -l dist/*.whl | grep -q 'veripp/include/veripp/contracts.hpp'
      - name: Install the wheel on its own and check it can find its header
        run: |
          uv tool install ./dist/*.whl
          cd "$(mktemp -d)"   # nowhere near the source tree
          veripp doctor | tee doctor.txt
          grep -q 'contracts header: /' doctor.txt

  npx-installer:
    name: npx installer
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['18', '20', '22']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      # Pack and install for real: `npm pack` is what decides which files
      # reach a user, and a skill whose SKILL.md was left out of `files`
      # installs an empty directory without erroring.
      - name: Pack and install globally
        run: |
          npm pack
          npm install -g ./veripp-skill-*.tgz

      - name: The packed tarball must contain the skill
        run: |
          tar tzf veripp-skill-*.tgz | grep -q 'package/skills/veripp/SKILL.md'
          tar tzf veripp-skill-*.tgz | grep -q 'package/skills/veripp/install.sh'

      - name: Behaviour
        run: sh npm/test-install.sh

  windows:
    name: windows CLI
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.0.1

      # The CLI is pure Python and should be portable; this is the only way to
      # find out rather than assume. ESBMC itself is fetched below, so the
      # verification path is exercised too, not just argument parsing.
      - name: Install
        run: uv sync

      - name: The parts that do not need a checker
        run: uv run pytest -q -rs -m "not esbmc"

      - name: Fetch ESBMC for Windows
        run: |
          curl.exe -L -o esbmc.zip https://github.com/esbmc/esbmc/releases/download/weekly/esbmc-windows.zip
          tar -xf esbmc.zip
          Get-ChildItem -Recurse -Filter esbmc.exe | Select-Object -First 1 -ExpandProperty DirectoryName |
            Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        shell: pwsh

      # `veripp` is not on PATH here -- uv owns the environment. The bare
      # command failed for six runs while continue-on-error swallowed it,
      # which is exactly the way that flag hides things.
      - name: Is the checker present, and is it sound?
        run: uv run veripp doctor

      - name: Verify a function end to end
        run: uv run veripp verify examples/off_by_one.cpp --function sum_array
        # exit 1 is the correct answer: this example contains a real bug.
        continue-on-error: true

      - name: The verification must have produced a real verdict
        run: |
          uv run veripp verify examples/off_by_one.cpp --function sum_array --json-out r.json
          python -c "import json; d=json.load(open('r.json')); assert d['outcome']=='counterexample', d['outcome']; print('windows verdict:', d['outcome'])"
        shell: pwsh
