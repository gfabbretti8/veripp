name: ci
on: [push, pull_request]

env:
  # Pinned: the golden transcripts in tests/golden/ are this version's output.
  ESBMC_VERSION: v8.4

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1  # no floating v10 tag is published
        with:
          enable-cache: true

      - name: Cache ESBMC
        id: cache-esbmc
        uses: actions/cache@v4
        with:
          path: ~/.local/esbmc
          key: esbmc-${{ env.ESBMC_VERSION }}-linux

      - name: Install ESBMC
        if: steps.cache-esbmc.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.local/esbmc
          curl -fsSL -o /tmp/esbmc.zip \
            "https://github.com/esbmc/esbmc/releases/download/${ESBMC_VERSION}/esbmc-linux.zip"
          unzip -q /tmp/esbmc.zip -d ~/.local/esbmc
          chmod +x "$(find ~/.local/esbmc -name esbmc -type f | head -1)"

      - name: Put ESBMC on PATH
        run: dirname "$(find ~/.local/esbmc -name esbmc -type f | head -1)" >> "$GITHUB_PATH"

      - run: esbmc --version

      # --locked fails if uv.lock is out of date with pyproject.toml, so a
      # dependency change cannot land without its lockfile update.
      - run: uv sync --locked
      # v8.4 is pinned for the golden transcripts, and it carries the known
      # esbmc#6508 member-array hole (fixed upstream, unreleased). Surface it
      # in the log without failing the build.
      - run: uv run veripp doctor --allow-unsound
      - run: uv run pytest -q

  # The tests run from a source checkout; this proves the published artifact
  # works too. The contracts header must ship inside the wheel or every
  # verification fails with "'veripp/contracts.hpp' file not found".
  wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.0.1  # no floating v10 tag is published
        with:
          enable-cache: true
      - run: uv build
      - name: The header must be in the wheel
        run: unzip -l dist/*.whl | grep -q 'veripp/include/veripp/contracts.hpp'
      - name: Install the wheel on its own and check it can find its header
        run: |
          uv tool install ./dist/*.whl
          cd "$(mktemp -d)"   # nowhere near the source tree
          veripp doctor | tee doctor.txt
          grep -q 'contracts header: /' doctor.txt
