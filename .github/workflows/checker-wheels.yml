# Build `veripp-checker` wheels: the ESBMC binary, packaged so that
# `pip install veripp[checker]` is the whole installation.
#
# Nothing is published from here. A wheel is kept only if a clean container
# that pip-installs it passes `veripp doctor`, whose probes are known-failing
# programs the checker must reject -- publishing a checker that misses a
# planted bug would turn every result obtained from it into a false proof.
name: checker-wheels

on:
  workflow_dispatch:
  push:
    tags: ["checker-v*"]

permissions:
  contents: read

jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Assemble a relocatable payload
        run: ./checker/build_linux_payload.sh ghcr.io/gfabbretti8/veripp payload

      - name: Fetch ESBMC's licence notices
        # Required by build_wheel.py: ESBMC derives from CBMC under
        # BSD-4-clause, whose advertising clause obliges the notice to travel
        # with the binary.
        run: curl -fsSL -o COPYING.esbmc
             https://raw.githubusercontent.com/esbmc/esbmc/master/COPYING

      - name: Determine the glibc floor
        id: glibc
        run: |
          floor=$(docker run --rm --entrypoint sh veripp-checker-payload -c \
            'for f in /payload/bin/esbmc /payload/lib/*.so*; do
               objdump -T "$f" 2>/dev/null | grep -o "GLIBC_[0-9.]*"; done |
             sort -V -u | tail -1' | sed 's/GLIBC_//;s/\./_/')
          # A statically linked checker reports no floor at all. Claiming the
          # oldest widely supported baseline is right there -- it needs
          # nothing from the host -- but an empty value would silently build
          # a wheel tagged `manylinux__x86_64`, which installs nowhere.
          if [ -z "$floor" ]; then floor=2_17; fi
          echo "tag=manylinux_${floor}_${{ matrix.arch }}" >> "$GITHUB_OUTPUT"

      - name: Build the wheel
        run: python3 checker/build_wheel.py --payload payload
             --plat ${{ steps.glibc.outputs.tag }}
             --license COPYING.esbmc --outdir dist

      - name: A wheel is only kept if it passes the soundness probes
        run: |
          mkdir -p itest && cp dist/*.whl itest/
          tar -cf - src pyproject.toml README.md LICENSE |
            (mkdir -p itest/veripp && tar -C itest/veripp -xf -)
          cat > itest/Dockerfile <<'EOF'
          FROM python:3.12-slim
          COPY veripp_checker-*.whl /tmp/
          COPY veripp /tmp/veripp
          RUN pip install -q /tmp/veripp_checker-*.whl && pip install -q /tmp/veripp
          EOF
          docker build -q -t veripp-wheel-itest itest
          docker run --rm veripp-wheel-itest sh -c '
            test -n "$(python -c "import veripp_checker;print(veripp_checker.esbmc_path() or \"\")")" \
              || { echo "the wheel carries no runnable checker"; exit 1; }
            veripp doctor'

      - uses: actions/upload-artifact@v4
        with:
          name: veripp-checker-${{ matrix.arch }}
          path: dist/*.whl

  # The binary-free wheel. pip ranks a platform wheel above `any`, so this is
  # selected only where nothing else fits -- and there it is what keeps
  # `pip install veripp` resolving at all, instead of failing on a platform
  # nobody publishes a checker for.
  fallback:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch ESBMC's licence notices
        run: curl -fsSL -o COPYING.esbmc
             https://raw.githubusercontent.com/esbmc/esbmc/master/COPYING

      - name: Build the binary-free wheel
        run: python3 checker/build_wheel.py --fallback
             --license COPYING.esbmc --outdir dist

      - name: It must install, carry no checker, and not break veripp
        run: |
          python -m venv /tmp/v && /tmp/v/bin/pip install -q dist/*.whl .
          test -z "$(/tmp/v/bin/python -c             'import veripp_checker; print(veripp_checker.esbmc_path() or "")')"             || { echo "the fallback wheel carries a binary"; exit 1; }
          /tmp/v/bin/veripp --version

      - uses: actions/upload-artifact@v4
        with:
          name: veripp-checker-any
          path: dist/*.whl

  # Publishing happens only from a `checker-v*` tag, and only after every
  # wheel above has been built and proved sound. The `any` wheel must go up
  # in the same run as the platform wheels: it is what lets veripp depend on
  # veripp-checker unconditionally, so publishing platform wheels without it
  # would break `pip install veripp` everywhere else.
  publish:
    needs: [linux, fallback]
    if: startsWith(github.ref, 'refs/tags/checker-v')
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: collected

      - name: Gather the wheels
        run: mkdir -p dist && find collected -name '*.whl' -exec mv {} dist/ \;
             && ls -la dist

      - name: Refuse to publish an incomplete set
        # A platform wheel without the fallback, or a fallback without any
        # platform wheel, both leave users worse off than publishing nothing.
        run: |
          test -n "$(ls dist/*-any.whl 2>/dev/null)" \
            || { echo "missing the py3-none-any fallback wheel"; exit 1; }
          test "$(ls dist/*manylinux*.whl 2>/dev/null | wc -l)" -ge 2 \
            || { echo "expected a wheel for each supported architecture"; exit 1; }

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_TOKEN }}
