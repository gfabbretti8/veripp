name: action-selftest

# The composite action had no test at all, which is how it shipped with
# `uv run --directory` -- a flag that resolves the caller's `source:` against
# the action's own checkout, so every relative path failed. Nothing in the
# suite could see that, because nothing ran the action.
#
# This runs it the way a caller does, from a working directory that is NOT the
# action's, which is the specific condition that bug needed.

on:
  push:
    paths: ['action.yml', '.github/workflows/action-selftest.yml', 'src/**']
  pull_request:
    paths: ['action.yml', '.github/workflows/action-selftest.yml', 'src/**']
  workflow_dispatch:

jobs:
  finds-a-bug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # examples/off_by_one.cpp has a real off-by-one. The action must fail
      # the job on it, because that is the whole product.
      - id: run
        continue-on-error: true
        uses: ./
        with:
          source: examples/off_by_one.cpp
          function: sum_array

      - name: The action must have reported a counterexample
        run: |
          if [ "${{ steps.run.outcome }}" != "failure" ]; then
            echo "::error::veripp passed a file with a known off-by-one"
            exit 1
          fi
          got="${{ steps.run.outputs.outcome }}"
          if [ "$got" != "counterexample" ]; then
            echo "::error::expected outcome=counterexample, got '$got'"
            exit 1
          fi
          echo "correctly failed on a known bug, outcome=$got"

  proves-a-good-one:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # A relative path from a subdirectory: the case `--directory` broke.
      - run: mkdir -p nested && cp examples/ring_buffer.cpp nested/

      - id: run
        uses: ./
        with:
          source: nested/ring_buffer.cpp
          function: push

      # Asserting the job merely passed is too weak: the action exits 0 on an
      # inconclusive result too, so this would stay green if nothing were ever
      # proved. Check the verdict itself.
      - name: It must actually have proved something
        run: |
          got="${{ steps.run.outputs.outcome }}"
          if [ "$got" != "verified" ]; then
            echo "::error::expected outcome=verified, got '$got'"
            exit 1
          fi
          echo "outcome=$got, exit-code=${{ steps.run.outputs.exit-code }}"

      - name: The JSON report must exist and be parseable
        run: |
          python3 -c "import json,sys; d=json.load(open(sys.argv[1])); \
            print('report outcome:', d['outcome'])" "${{ steps.run.outputs.report }}"

  fail-on-never-is-honest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Must succeed despite pointing at a file with a known bug.
      - id: run
        uses: ./
        with:
          source: examples/off_by_one.cpp
          function: sum_array
          fail-on: never

      # fail-on: never must suppress the failure, not the finding. Reporting
      # "verified" here would be far worse than a red build.
      - name: Still reports the counterexample it declined to fail on
        run: |
          got="${{ steps.run.outputs.outcome }}"
          if [ "$got" != "counterexample" ]; then
            echo "::error::fail-on:never changed the verdict to '$got'"
            exit 1
          fi
          echo "stayed green and still reported: $got"

  refuses-a-lying-checker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # A checker that reports VERIFICATION SUCCESSFUL for everything is the
      # worst thing that can happen to a verification tool: every result it
      # produces is a false assurance. The action must reject it before
      # verifying anything, not after.
      - name: Put a checker that lies about everything on PATH
        run: |
          cat > /usr/local/bin/esbmc <<'EOF'
          #!/bin/sh
          case "$*" in
            *--version*) echo "ESBMC version 8.4.0 64-bit x86_64 linux"; exit 0 ;;
          esac
          echo "VERIFICATION SUCCESSFUL"
          exit 0
          EOF
          chmod +x /usr/local/bin/esbmc

      - id: run
        continue-on-error: true
        uses: ./
        with:
          source: examples/ring_buffer.cpp
          function: push
          # Even the setting that suppresses findings must not suppress this:
          # fail-on controls what to do with a verdict, and there is no
          # trustworthy verdict to be had from a checker that cannot detect a
          # planted bug.
          fail-on: never

      - name: The soundness gate must have stopped it
        run: |
          if [ "${{ steps.run.outcome }}" != "failure" ]; then
            echo "::error::the action accepted a checker that passes known-failing programs"
            exit 1
          fi
          echo "correctly refused to verify anything with an unsound checker"

  args-reach-the-checker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The `args` input carries the flags real projects need (-I, -D,
      # --unwind, --link). It is passed through a shell where word splitting
      # is deliberate, so it is exactly the kind of thing that breaks quietly.
      # This fixture cannot compile at all unless BOTH an -I and a -D arrive:
      # the header is elsewhere, and the bound comes from a macro.
      - name: A source that needs an include path and a define
        run: |
          mkdir -p fixture/include
          cat > fixture/include/limits_cfg.h <<'EOF'
          #define CFG_MAX 4
          EOF
          cat > fixture/bounded.c <<'EOF'
          #include "limits_cfg.h"
          int at(const int *a, int i) {
            if (i < 0 || i >= CFG_MAX) return 0;
            return a[i];
          }
          EOF

      - id: without
        continue-on-error: true
        uses: ./
        with:
          source: fixture/bounded.c
          function: at
          fail-on: never

      - name: Without the include path it cannot even parse
        run: |
          got="${{ steps.without.outputs.outcome }}"
          if [ "$got" = "verified" ]; then
            echo "::error::fixture verified without its include path; it is not testing anything"
            exit 1
          fi
          echo "as expected, unusable without args: $got"

      - id: with
        uses: ./
        with:
          source: fixture/bounded.c
          function: at
          args: -I fixture/include -D VERIPP_SELFTEST=1

      - name: With them it verifies, so both flags arrived
        run: |
          got="${{ steps.with.outputs.outcome }}"
          if [ "$got" != "verified" ]; then
            echo "::error::expected verified once -I and -D were passed, got '$got'"
            exit 1
          fi
          echo "args reached the checker: $got"

  scans-a-directory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # What a client actually configures: point it at the source tree, not at
      # one file. A finding in any file must fail the job, and the summary must
      # count the proofs rather than reporting zero.
      - name: A small tree with one good file and one bad
        run: |
          mkdir -p tree/src/sub tree/build
          cat > tree/src/good.c <<'EOF'
          int clamp(int x) { if (x < 0) return 0; if (x > 100) return 100; return x; }
          EOF
          cat > tree/src/sub/bad.c <<'EOF'
          int mean(int a, int b) { return (a + b) / 2; }
          EOF
          # Must be ignored: a finding here would be in code nobody owns.
          cat > tree/build/vendored.c <<'EOF'
          int also_broken(int a, int b) { return (a + b) / 2; }
          EOF

      - id: run
        continue-on-error: true
        uses: ./
        with:
          source: tree

      - name: A finding anywhere in the tree fails the job
        run: |
          if [ "${{ steps.run.outcome }}" != "failure" ]; then
            echo "::error::a tree containing a known overflow did not fail"
            exit 1
          fi
          got="${{ steps.run.outputs.outcome }}"
          [ "$got" = "counterexample" ] || { echo "::error::outcome was '$got'"; exit 1; }
          echo "tree scan reported: $got"

      - name: It scanned the sources and ignored the build directory
        run: |
          python3 - "${{ steps.run.outputs.report }}" <<'PY'
          import json, sys
          report = json.load(open(sys.argv[1]))
          files = [entry["file"] for entry in report["per_file"]]
          assert report["files"] == 2, f"expected 2 files, got {files}"
          assert not any("build/" in f for f in files), f"scanned build/: {files}"
          assert report["proved"] >= 1, "clamp should have been proved"
          found = {c["function"] for c in report["counterexamples"]}
          assert found == {"mean"}, found
          print("per_file:", files, "proved:", report["proved"])
          PY
