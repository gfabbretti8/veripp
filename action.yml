name: 'veripp'
description: 'Prove C/C++ functions free of overflow, out-of-bounds, null deref and division by zero.'
branding:
  icon: 'check-circle'
  color: 'blue'

inputs:
  source:
    description: 'File to scan, or a single file to verify with `function`.'
    required: true
  function:
    description: 'Verify one function instead of scanning the whole file.'
    required: false
  args:
    description: 'Extra veripp arguments (-I, -D, --link, --unwind, --timeout ...).'
    required: false
    default: ''
  fail-on:
    description: >-
      When to fail the job. "counterexample" (default) fails only on findings;
      "never" reports without failing, which is the honest setting for a first
      run, since a generated harness produces leads that still need triage.
    required: false
    default: 'counterexample'
  esbmc-version:
    description: >-
      ESBMC release tag. Defaults to `weekly`, because the v8.4 release
      silently misses out-of-bounds writes in ordinary container code
      (esbmc/esbmc#6508), which veripp checks for and refuses to build proofs
      on. Note that `weekly` is cut infrequently despite the name, so it is
      not the same as master; `veripp doctor` probes whichever build you get.
    required: false
    default: 'weekly'

runs:
  using: 'composite'
  steps:
    - name: Install uv
      uses: astral-sh/setup-uv@v10.0.1
      with:
        enable-cache: true

    - name: Cache ESBMC
      id: cache-esbmc
      uses: actions/cache@v4
      with:
        path: ~/.cache/veripp-esbmc
        key: veripp-esbmc-${{ inputs.esbmc-version }}-${{ runner.os }}

    - name: Install ESBMC
      if: steps.cache-esbmc.outputs.cache-hit != 'true'
      shell: bash
      env:
        ESBMC_VERSION: ${{ inputs.esbmc-version }}
      run: |
        set -euo pipefail
        mkdir -p ~/.cache/veripp-esbmc
        arch="$(uname -m)"
        case "${{ runner.os }}:$arch" in
          Linux:x86_64|Linux:amd64)
            asset=esbmc-linux.zip ;;
          macOS:*)
            asset=esbmc-macos.zip ;;
          Linux:aarch64|Linux:arm64)
            # esbmc publishes no arm64 Linux binary, and the only prebuilt one
            # anywhere (the Homebrew 8.4 bottle) silently misses out-of-bounds
            # writes -- esbmc/esbmc#6508 -- which is exactly what veripp is
            # for. Say so instead of downloading an x86_64 binary that cannot
            # execute and failing three steps later with "exec format error".
            echo "::error::veripp's action needs an x86_64 Linux or a macOS" \
                 "runner: upstream publishes no arm64 Linux ESBMC binary, and" \
                 "the only prebuilt arm64 build is unsound (esbmc/esbmc#6508)." \
                 "On an arm64 runner, use the container image instead:" \
                 "docker run --rm -v \"\$PWD:/src\" ghcr.io/gfabbretti8/veripp scan FILE"
            exit 1 ;;
          *)
            echo "::error::veripp's action supports x86_64 Linux and macOS runners (got ${{ runner.os }}/$arch)"
            exit 1 ;;
        esac
        curl -fsSL -o /tmp/esbmc.zip \
          "https://github.com/esbmc/esbmc/releases/download/$ESBMC_VERSION/$asset"
        unzip -q /tmp/esbmc.zip -d ~/.cache/veripp-esbmc

    - name: Put ESBMC on PATH
      shell: bash
      run: |
        bin="$(find ~/.cache/veripp-esbmc -name esbmc -type f | head -1)"
        chmod +x "$bin"
        dirname "$bin" >> "$GITHUB_PATH"

    - name: Check the checker
      shell: bash
      # --project, never --directory: --directory changes the working
      # directory, which would resolve the user's `source` relative to this
      # action's checkout instead of their workspace, breaking every relative
      # path. --project points uv at the environment without moving us.
      run: uv run --project "$GITHUB_ACTION_PATH" veripp doctor

    - name: Run veripp
      shell: bash
      # Inputs arrive as environment variables rather than being interpolated
      # into the script text: a branch name or an args string is attacker-
      # controllable on pull_request, and ${{ }} substitution would splice it
      # straight into this shell.
      env:
        VERIPP_SOURCE: ${{ inputs.source }}
        VERIPP_FUNCTION: ${{ inputs.function }}
        VERIPP_ARGS: ${{ inputs.args }}
        VERIPP_FAIL_ON: ${{ inputs.fail-on }}
      run: |
        set -uo pipefail
        # Word-splitting of VERIPP_ARGS is intended -- it carries flags like
        # `-I include -D NDEBUG`.
        # shellcheck disable=SC2086
        if [ -n "$VERIPP_FUNCTION" ]; then
          uv run --project "$GITHUB_ACTION_PATH" \
            veripp verify "$VERIPP_SOURCE" --function "$VERIPP_FUNCTION" $VERIPP_ARGS
        else
          uv run --project "$GITHUB_ACTION_PATH" \
            veripp scan "$VERIPP_SOURCE" $VERIPP_ARGS
        fi
        status=$?

        # 0 verified, 1 counterexample, 2 usage, 3 inconclusive/vacuous.
        case "$status" in
          0) echo "::notice::veripp: verified within the stated bounds" ;;
          1) echo "::error::veripp: counterexample found" ;;
          2) echo "::error::veripp: bad invocation (see the log above)" ;;
          3) echo "::warning::veripp: inconclusive -- a bound, a timeout, or a vacuous proof. This is not a pass." ;;
        esac

        if [ "$VERIPP_FAIL_ON" = "never" ]; then exit 0; fi
        # A usage error is always worth failing on: it means the step never
        # actually checked anything.
        if [ "$status" -eq 3 ]; then exit 0; fi
        exit "$status"
