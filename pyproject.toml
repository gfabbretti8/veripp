[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "veripp"
version = "0.0.1"
description = "AI-operated formal verification for real C++ code (ESBMC + LLM agent loop)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Giovanni Fabbretti" }]
keywords = ["formal-verification", "model-checking", "esbmc", "cpp", "bmc", "llm"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: C++",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Software Development :: Testing",
]
dependencies = []

[project.optional-dependencies]
# Only the Anthropic provider needs a package: every other provider speaks the
# OpenAI-compatible HTTP API, which veripp calls with the standard library.
anthropic = ["anthropic>=0.40"]
llm = ["anthropic>=0.40"]  # kept as an alias

[project.scripts]
veripp = "veripp.cli:main"

[project.urls]
Homepage = "https://github.com/gfabbretti8/veripp"
Repository = "https://github.com/gfabbretti8/veripp"
Issues = "https://github.com/gfabbretti8/veripp/issues"

# PEP 735 group: `uv sync` installs it by default, `uv sync --no-dev` skips it.
[dependency-groups]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

# The contracts header is not documentation: veripp puts it on ESBMC's include
# path at run time, so a wheel without it cannot verify anything. It lives
# inside the package so every install layout carries it.
[tool.setuptools.package-data]
veripp = ["include/veripp/*.hpp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
