[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "veripp"
version = "0.7.0"
description = "AI-assisted bounded verification for C and C++ functions (ESBMC + optional LLM triage)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Giovanni Fabbretti" }]
keywords = ["formal-verification", "model-checking", "esbmc", "c", "cpp", "bmc", "llm", "memory-safety"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: C++",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Software Development :: Testing",
]
# No runtime dependencies. The checker is a native binary and travels inside
# veripp's own platform wheels (Linux x86_64 and arm64, made by
# checker/bundle_wheel.py from this pure wheel at release time); the pure
# wheel pip falls back to elsewhere has none, and there `veripp doctor` says
# what to run.
dependencies = []

[project.optional-dependencies]
# Only the Anthropic provider needs a package: every other provider speaks the
# OpenAI-compatible HTTP API, which veripp calls with the standard library.
anthropic = ["anthropic>=0.40"]
llm = ["anthropic>=0.40"]  # kept as an alias

[project.scripts]
veripp = "veripp.cli:main"

[project.urls]
Homepage = "https://github.com/gfabbretti8/veripp"
Repository = "https://github.com/gfabbretti8/veripp"
Issues = "https://github.com/gfabbretti8/veripp/issues"
Changelog = "https://github.com/gfabbretti8/veripp/blob/main/CHANGELOG.md"

# PEP 735 group: `uv sync` installs it by default, `uv sync --no-dev` skips it.
[dependency-groups]
# PyYAML is a test dependency, not a runtime one: several tests parse the
# workflows to check they are valid and that the act harness enumerates the
# same jobs the workflow defines. Without it those tests skip silently, which
# is how they were never running anywhere -- neither locally nor in CI.
# jsonschema validates the SARIF output against the real 2.1.0 schema.
# GitHub rejects invalid SARIF outright, and without this declared the
# check skips silently -- the same way the workflow-parsing tests did.
dev = ["pytest>=8", "pyyaml>=6", "jsonschema>=4"]

[tool.setuptools.packages.find]
where = ["src"]

# The README tells people to run these, so an sdist without them is a broken
# promise. They are small and text-only.
[tool.setuptools.data-files]
"share/veripp/examples" = ["examples/*.cpp"]

# The contracts header is not documentation: veripp puts it on ESBMC's include
# path at run time, so a wheel without it cannot verify anything. It lives
# inside the package so every install layout carries it.
[tool.setuptools.package-data]
veripp = ["include/veripp/*.hpp"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
# The oldest Python veripp supports: an API newer than this is an error
# here rather than an AttributeError on someone's 3.10.
python_version = "3.10"

[tool.ruff]
# The requires-python floor. Syntax newer than this -- a PEP 701 f-string
# reusing its own quote, say -- is a syntax error here rather than a
# traceback on the oldest Python veripp claims to support.
target-version = "py310"

[tool.ruff.lint]
# Errors only: syntax errors, invalid comparisons, misplaced statements and
# undefined names. ruff's style rules would ask for thirty edits across the
# tree, which belong in a change of their own.
select = ["E9", "F63", "F7", "F82"]
