[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "veripp"
version = "0.0.1"
description = "AI-operated formal verification for real C++ code (ESBMC + LLM agent loop)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = []

[project.optional-dependencies]
llm = ["anthropic>=0.40"]
dev = ["pytest>=8"]

[project.scripts]
veripp = "veripp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
